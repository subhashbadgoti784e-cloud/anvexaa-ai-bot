<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Outer subtle circuit glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="8 8" />

  <!-- WhatsApp Speech Bubble Base -->
  <path d="M256 120 C180.88 120 120 178.2 120 250 C120 274.6 127.1 297.7 139.5 317.2 L124 374 L183.5 358.8 C204.8 371.8 229.6 380 256 380 C331.12 380 392 321.8 392 250 C392 178.2 331.12 120 256 120 Z" 
        fill="#022c22" stroke="url(#primary)" stroke-width="12" filter="url(#glow)" />

  <!-- Anvexaa 'A' AI Iconography inside Bubble -->
  <path d="M256 170 L320 310 L286 310 L272 278 L240 278 L226 310 L192 310 Z M256 220 L246 252 L266 252 Z" 
        fill="url(#primary)" />

  <!-- AI Neural Nodes & Sparks -->
  <circle cx="256" cy="165" r="8" fill="#38bdf8" />
  <circle cx="320" cy="310" r="7" fill="#10b981" />
  <circle cx="192" cy="310" r="7" fill="#10b981" />
  <circle cx="340" cy="210" r="6" fill="#a7f3d0" />
  <circle cx="172" cy="210" r="6" fill="#a7f3d0" />

  <!-- Connection Lines -->
  <line x1="256" y1="165" x2="340" y2="210" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.6" />
  <line x1="256" y1="165" x2="172" y2="210" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.6" />
  <line x1="340" y1="210" x2="320" y2="310" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.6" />
  <line x1="172" y1="210" x2="192" y2="310" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.6" />
</svg>
